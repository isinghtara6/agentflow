name: ci-cd
on:
  push: { branches: [main] }
  pull_request:

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests
      - run: pytest -q

  build-deploy:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: docker/build-push-action@v6
        with: { push: true, tags: "${{ env.IMAGE }}:${{ github.sha }},${{ env.IMAGE }}:latest" }
      - uses: azure/setup-kubectl@v4
      - name: Deploy
        env: { KUBECONFIG_B64: "${{ secrets.KUBECONFIG_B64 }}" }
        run: |
          echo "$KUBECONFIG_B64" | base64 -d > kubeconfig
          export KUBECONFIG=$PWD/kubeconfig
          kubectl apply -f k8s/deployment.yaml -f k8s/hpa-pdb.yaml -f k8s/ingress.yaml
          kubectl set image deployment/agentflow api=$IMAGE:${{ github.sha }}
          kubectl rollout status deployment/agentflow --timeout=180s
