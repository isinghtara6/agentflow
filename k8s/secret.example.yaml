# DO NOT commit real values. Prefer External Secrets / Sealed Secrets in production.
# kubectl create secret generic agentflow-secrets --from-env-file=.env.prod
apiVersion: v1
kind: Secret
metadata:
  name: agentflow-secrets
type: Opaque
stringData:
  ANTHROPIC_API_KEY: "sk-ant-..."
  API_KEYS: "client-key-1,client-key-2"
  REDIS_URL: "rediss://:password@your-managed-redis:6379/0"   # ElastiCache / Memorystore / Upstash
